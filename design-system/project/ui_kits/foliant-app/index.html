<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Foliant — app desktop</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:16px}#nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}#nav button{min-height:32px;padding:0 10px;border-radius:var(--radius-sm);border:1px solid var(--gray-300);background:var(--white);color:var(--gray-700);font:500 13px var(--font-sans);cursor:pointer}#nav button[aria-current="true"]{background:var(--blue-800);border-color:var(--blue-800);color:var(--white)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="ScreensStart.jsx"></script>
<script type="text/babel" src="ScreensConvert.jsx"></script>
<script type="text/babel" src="ScreensResult.jsx"></script>
<script type="text/babel">
const steps = ["Instalação","Selecionar","Antes de converter","Convertendo","Pronto","Com ressalva","Falha"];
function Kit(){
  const [step,setStep] = React.useState(1);
  const go = (n) => () => setStep(n);
  const screen = [
    <window.GatekeeperScreen onNext={go(1)} />,
    <window.SelectScreen onNext={go(2)} />,
    <window.PreviewScreen onNext={go(3)} onBack={go(1)} />,
    <window.ConvertingScreen onNext={go(4)} onError={go(6)} />,
    <window.SuccessScreen onRestart={go(1)} />,
    <window.SuccessScreen onRestart={go(1)} warning />,
    <window.ErrorScreen onRetry={go(3)} />,
  ][step];
  return <>
    <div id="nav">{steps.map((s,i)=>
      <button key={s} aria-current={i===step} onClick={go(i)}>{s}</button>)}</div>
    {screen}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Kit />);
</script></body></html>
