<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Azul</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div class="sw"><div class="chip"><div class="b" style="background:#15375F"></div><div class="t"><b>--blue-900</b><code>#15375F</code><div>Header, selo</div></div></div><div class="chip"><div class="b" style="background:#1E4D8C"></div><div class="t"><b>--blue-800</b><code>#1E4D8C</code><div>Marca, botão, link</div></div></div><div class="chip"><div class="b" style="background:#2A609E"></div><div class="t"><b>--blue-700</b><code>#2A609E</code><div>Hover/press</div></div></div><div class="chip"><div class="b" style="background:#3A73B5"></div><div class="t"><b>--blue-600</b><code>#3A73B5</code><div>Foco, borda ativa</div></div></div><div class="chip"><div class="b" style="background:#E4ECF5"></div><div class="t"><b>--blue-100</b><code>#E4ECF5</code><div>Tint de fundo</div></div></div></div></body></html>
