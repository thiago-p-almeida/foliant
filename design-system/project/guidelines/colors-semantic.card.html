<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Semânticas</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div class="sw"><div class="chip"><div class="b" style="background:#9B3636"></div><div class="t"><b>--red-700</b><code>#9B3636</code><div>Erro real</div></div></div><div class="chip"><div class="b" style="background:#F6E4E4"></div><div class="t"><b>--red-100</b><code>#F6E4E4</code><div>Fundo de erro</div></div></div><div class="chip"><div class="b" style="background:#8A5A1F"></div><div class="t"><b>--amber-700</b><code>#8A5A1F</code><div>Aviso do sistema, ressalva</div></div></div><div class="chip"><div class="b" style="background:#A06A24"></div><div class="t"><b>--amber-600</b><code>#A06A24</code><div>Borda/ícone de aviso</div></div></div><div class="chip"><div class="b" style="background:#F7EFD9"></div><div class="t"><b>--amber-100</b><code>#F7EFD9</code><div>Fundo de aviso</div></div></div></div><p style="margin:12px 0 0;font-size:12px;color:var(--gray-700)">O aviso do macOS na primeira abertura usa a família âmbar — nunca vermelha: é rotina do sistema, não falha do app.</p></body></html>
