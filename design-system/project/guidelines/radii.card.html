<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Raios</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div style="display:flex;gap:16px">
<div style="width:150px;height:78px;background:var(--white);border:1px solid var(--gray-300);border-radius:4px;display:grid;place-items:center;font-size:12px;color:var(--gray-700)">4px · input, tag</div>
<div style="width:150px;height:78px;background:var(--beige);border:1px solid var(--gray-300);border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--gray-700)">8px · card, botão</div>
<div style="width:180px;height:78px;background:var(--beige-200);border:2px dashed var(--gray-300);border-radius:12px;display:grid;place-items:center;font-size:12px;color:var(--gray-700)">12px · drop, modal</div>
</div></body></html>
