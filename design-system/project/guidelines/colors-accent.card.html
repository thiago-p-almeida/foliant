<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Verde</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div class="sw"><div class="chip"><div class="b" style="background:#226640"></div><div class="t"><b>--green-700</b><code>#226640</code><div>Texto/ícone de sucesso</div></div></div><div class="chip"><div class="b" style="background:#24663C"></div><div class="t"><b>--green-600</b><code>#24663C</code><div>Barra, botão de sucesso</div></div></div><div class="chip"><div class="b" style="background:#E5F0E9"></div><div class="t"><b>--green-100</b><code>#E5F0E9</code><div>Fundo de card de sucesso</div></div></div></div></body></html>
