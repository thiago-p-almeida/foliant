<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Escala</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--blue-800);border-radius:2px"></div><code style="font-size:10px;color:var(--gray-500);display:block;margin-top:6px">4</code></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--blue-800);border-radius:2px"></div><code style="font-size:10px;color:var(--gray-500);display:block;margin-top:6px">8</code></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--blue-800);border-radius:2px"></div><code style="font-size:10px;color:var(--gray-500);display:block;margin-top:6px">12</code></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--blue-800);border-radius:2px"></div><code style="font-size:10px;color:var(--gray-500);display:block;margin-top:6px">16</code></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--blue-800);border-radius:2px"></div><code style="font-size:10px;color:var(--gray-500);display:block;margin-top:6px">24</code></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--blue-800);border-radius:2px"></div><code style="font-size:10px;color:var(--gray-500);display:block;margin-top:6px">32</code></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--blue-800);border-radius:2px"></div><code style="font-size:10px;color:var(--gray-500);display:block;margin-top:6px">48</code></div></div></body></html>
