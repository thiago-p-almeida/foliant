<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Toque</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div style="display:flex;align-items:center;gap:24px">
<div style="width:44px;height:44px;border:1px dashed var(--blue-600);border-radius:8px;display:grid;place-items:center"><div style="width:24px;height:24px;background:var(--blue-800);border-radius:3px"></div></div>
<p style="margin:0;font-size:13px;color:var(--gray-700);max-width:420px">O dispositivo dominante da persona é tablet Android, onde a precisão de toque é menor que com mouse: toda linha clicável tem 44px de altura mínima.</p></div></body></html>
