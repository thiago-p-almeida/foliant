<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Neutros</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div class="sw"><div class="chip"><div class="b" style="background:#FAF7F2"></div><div class="t"><b>--warm-white</b><code>#FAF7F2</code><div>Fundo do app</div></div></div><div class="chip"><div class="b" style="background:#F2EBE0"></div><div class="t"><b>--beige</b><code>#F2EBE0</code><div>Card</div></div></div><div class="chip"><div class="b" style="background:#EAE0D0"></div><div class="t"><b>--beige-200</b><code>#EAE0D0</code><div>Card em card, drop</div></div></div><div class="chip"><div class="b" style="background:#2A2520"></div><div class="t"><b>--gray-800</b><code>#2A2520</code><div>Título</div></div></div><div class="chip"><div class="b" style="background:#3A3530"></div><div class="t"><b>--gray-700</b><code>#3A3530</code><div>Corpo</div></div></div><div class="chip"><div class="b" style="background:#6B6258"></div><div class="t"><b>--gray-500</b><code>#6B6258</code><div>Secundário</div></div></div><div class="chip"><div class="b" style="background:#897A60"></div><div class="t"><b>--gray-300</b><code>#897A60</code><div>Borda, divisor</div></div></div></div></body></html>
