<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Elevação</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div style="display:flex;gap:16px;align-items:center">
<div style="width:150px;height:70px;background:var(--white);border:1px solid var(--gray-300);border-radius:8px;box-shadow:var(--shadow-card);display:grid;place-items:center;font-size:11px;color:var(--gray-700);text-align:center">--shadow-card<br><code style="font-size:10px;color:var(--gray-500)">0 1px 2px</code></div><div style="width:150px;height:70px;background:var(--white);border:1px solid var(--gray-300);border-radius:8px;box-shadow:var(--shadow-raised);display:grid;place-items:center;font-size:11px;color:var(--gray-700);text-align:center">--shadow-raised<br><code style="font-size:10px;color:var(--gray-500)">0 2px 6px</code></div><div style="width:150px;height:70px;background:var(--white);border:1px solid var(--gray-300);border-radius:8px;box-shadow:var(--shadow-modal);display:grid;place-items:center;font-size:11px;color:var(--gray-700);text-align:center">--shadow-modal<br><code style="font-size:10px;color:var(--gray-500)">0 8px 24px</code></div>
<p style="margin:0;font-size:12px;color:var(--gray-700);max-width:180px">Fades e mudanças de cor com <code style="font-size:11px">--ease-standard</code>. Sem bounce, sem sombra colorida.</p></div></body></html>
