<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Pesos</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div style="display:flex;flex-direction:column;gap:8px;font-size:17px;color:var(--gray-800)">
<div style="font-weight:400">400 — corpo, texto de erro, legenda</div>
<div style="font-weight:500">500 — rótulo, botão, nome de fase, selo</div>
<div style="font-weight:700">700 — display e heading, só isso</div>
<div style="font-size:13px;color:var(--gray-700);border-top:1px solid var(--gray-300);padding-top:8px">Nunca peso 300 nem acima de 700. Nunca negrito em corpo de texto nem em texto de erro — a cor já diferencia. Nunca uma segunda família.</div></div></body></html>
