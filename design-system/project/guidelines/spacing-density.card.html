<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Densidade</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:118px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;background:var(--white)}.chip .b{height:52px}.chip .t{padding:6px 8px;font-size:11px;line-height:1.35;color:var(--gray-700)}.chip .t b{display:block;font-weight:500;color:var(--gray-800)}.chip .t code{font-size:10px;color:var(--gray-500)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="padding:32px;background:var(--blue-100);border:1px solid var(--blue-600);border-radius:8px;font-size:13px;color:var(--blue-800)"><b>Essencial</b> — ação principal, área de drop · fundo de marca ou tint · 24–32px</div>
<div style="padding:16px;background:var(--beige);border:1px solid var(--gray-300);border-radius:8px;font-size:13px;color:var(--gray-700)"><b>Condicional</b> — metadados, opções avançadas · fundo neutro, recolhido por padrão · 16px</div>
<div style="padding:4px 12px;background:var(--amber-100);border:1px solid var(--amber-600);border-radius:4px;font-size:13px;color:var(--amber-700);display:inline-block;align-self:flex-start"><b>Contextual</b> — selo, aviso, badge · 4–12px</div>
</div></body></html>
