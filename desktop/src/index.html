<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foliant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Foliant</h1>
      <p class="subtitle">PDF &rarr; OCR &rarr; EPUB</p>

      <form id="form-conversao">
        <label>
          PDF de entrada
          <div class="row">
            <input id="pdf-entrada" type="text" readonly placeholder="Selecione um arquivo .pdf" />
            <button type="button" id="btn-selecionar-pdf">Selecionar…</button>
          </div>
        </label>

        <label>
          Salvar EPUB em:
          <div class="row">
            <input id="saida" type="text" readonly placeholder="Selecione onde salvar o .epub" />
            <button type="button" id="btn-selecionar-saida">Selecionar…</button>
          </div>
        </label>

        <label>
          Título
          <input id="titulo" type="text" placeholder="Foliant" />
        </label>

        <label>
          Autor
          <input id="autor" type="text" placeholder="ALMEIDA, Thiago." />
        </label>

        <label>
          Idioma do documento
          <input id="lang" type="text" value="por" />
          <span class="ajuda">Usado só para reconhecer texto em páginas escaneadas (OCR).</span>
        </label>

        <div class="row">
          <button id="btn-converter" type="submit">Converter</button>
          <button id="btn-cancelar" type="button" hidden>Cancelar</button>
        </div>
      </form>

      <div class="linha-atualizacao">
        <button id="btn-verificar-atualizacao" type="button" class="link-atualizacao">Verificar atualizações</button>
        <span id="status-atualizacao" class="status-atualizacao" role="status"></span>
      </div>

      <div id="progresso" class="progresso" hidden>
        <div class="fase" data-fase="ocr">
          <div class="fase-cabecalho">
            <span class="fase-check">&#10003;</span>
            <span class="fase-nome">OCR + análise</span>
            <span class="fase-contador"></span>
          </div>
          <div class="barra"><div class="barra-preenchimento"></div></div>
        </div>
        <div class="fase" data-fase="html">
          <div class="fase-cabecalho">
            <span class="fase-check">&#10003;</span>
            <span class="fase-nome">Montagem do HTML</span>
            <span class="fase-contador"></span>
          </div>
          <div class="barra"><div class="barra-preenchimento"></div></div>
        </div>
        <div class="fase" data-fase="epub">
          <div class="fase-cabecalho">
            <span class="fase-check">&#10003;</span>
            <span class="fase-nome">Compilação EPUB</span>
            <span class="fase-contador"></span>
          </div>
          <div class="barra"><div class="barra-preenchimento"></div></div>
        </div>
      </div>

      <div id="sucesso" class="sucesso" hidden></div>
      <div id="aviso" class="aviso" hidden role="alert"></div>

      <details id="log-detalhes">
        <summary>Ver log detalhado</summary>
        <pre id="log"></pre>
      </details>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
